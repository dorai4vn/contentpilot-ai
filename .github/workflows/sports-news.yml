name: Sports news automation

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sports-news
  cancel-in-progress: false

jobs:
  poll:
    if: ${{ vars.SPORTS_NEWS_CRON_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Process approved deliveries and check sports RSS
        env:
          CRON_URL: ${{ vars.SPORTS_NEWS_CRON_URL }}
          CRON_SECRET: ${{ secrets.SPORTS_NEWS_CRON_SECRET }}
        run: |
          curl --silent --show-error --fail-with-body --proto '=https' --max-time 200 \
            --request POST --header "Authorization: Bearer ${CRON_SECRET:?}" "${CRON_URL:?}"
